  <rect width="1280" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="1200" cy="20" r="240" fill="#7465e8" opacity=".10"/><circle cx="1130" cy="440" r="250" fill="#b7a9ff" opacity=".06"/>
